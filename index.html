<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>猫咪视频 · AI 生成</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  color: #fff;
}
.container {
  max-width: 900px;
  width: 100%;
  background: rgba(255, 255, 255, 0.05);
  backdrop-filter: blur(20px);
  border-radius: 24px;
  padding: 32px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
  border: 1px solid rgba(255, 255, 255, 0.1);
}
h1 {
  font-size: 28px;
  margin-bottom: 8px;
  background: linear-gradient(90deg, #ff6b9d, #c06c84);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.subtitle {
  color: rgba(255, 255, 255, 0.6);
  margin-bottom: 24px;
  font-size: 14px;
}
.video-wrap {
  position: relative;
  width: 100%;
  background: #000;
  border-radius: 16px;
  overflow: hidden;
  aspect-ratio: 16 / 9;
}
video {
  width: 100%;
  height: 100%;
  display: block;
}
.info {
  margin-top: 24px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 12px;
}
.info-item {
  background: rgba(255, 255, 255, 0.05);
  padding: 12px 16px;
  border-radius: 12px;
  border: 1px solid rgba(255, 255, 255, 0.08);
}
.label { font-size: 11px; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 1px; }
.value { font-size: 16px; font-weight: 600; margin-top: 4px; }
.prompt {
  margin-top: 20px;
  padding: 16px;
  background: rgba(255, 255, 255, 0.05);
  border-left: 3px solid #ff6b9d;
  border-radius: 8px;
  font-size: 14px;
  line-height: 1.6;
  color: rgba(255, 255, 255, 0.85);
}
.footer { text-align: center; margin-top: 20px; color: rgba(255,255,255,0.4); font-size: 12px; }
</style>
</head>
<body>
<div class="container">
  <h1>🐱 猫咪视频</h1>
  <div class="subtitle">Generated by MiniMax-Hailuo-2.3 via mmx CLI</div>
  <div class="video-wrap">
    <video controls autoplay loop muted playsinline>
      <source src="cat_video.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
  </div>
  <div class="info">
    <div class="info-item">
      <div class="label">Model</div>
      <div class="value">Hailuo-2.3</div>
    </div>
    <div class="info-item">
      <div class="label">Duration</div>
      <div class="value">5 sec</div>
    </div>
    <div class="info-item">
      <div class="label">Resolution</div>
      <div class="value">1366×768</div>
    </div>
    <div class="info-item">
      <div class="label">Size</div>
      <div class="value">0.69 MB</div>
    </div>
  </div>
  <div class="prompt">
    <strong>Prompt:</strong> A cute orange tabby cat playing with a ball of yarn on a sunny windowsill, soft natural lighting
  </div>
  <div class="footer">Deployed via GitHub Pages · 2026-06-02</div>
</div>
</body>
</html>
